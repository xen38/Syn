name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npx eslint . --ext .js --max-warnings 0

      - name: Run tests
        run: npm test
        # Required suites: search, search-quality, validator-precision,
        # fixture-tests, indexing, security, brainmaxxing, MCP.
        # Real-world integration test skips with explicit message when
        # harness data is not present (opt-in, never a CI failure).
